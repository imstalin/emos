services:
  redis:
    image: redis:7-alpine
    container_name: emos-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - emos_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Next.js app in Docker — Postgres stays on the host (localhost:5432)
  app:
    image: node:22-alpine
    container_name: emos-app
    working_dir: /app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      RUNNING_IN_DOCKER: "1"
      SKIP_DB_PUSH: "1"
      REDIS_URL: redis://redis:6379
      NEXT_PUBLIC_APP_URL: http://localhost:${APP_PORT:-3000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
      - emos_node_modules:/app/node_modules
      - emos_next_cache:/app/.next
      - ./docker/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    command:
      [
        "sh",
        "-c",
        "apk add --no-cache libc6-compat openssl >/dev/null; if [ ! -x node_modules/.bin/next ]; then npm ci; fi; npx prisma generate; npx prisma db push --skip-generate || echo 'Warning: db push failed — is host Postgres up on :5432?'; npm run dev -- -H 0.0.0.0 -p 3000",
      ]
    depends_on:
      redis:
        condition: service_healthy

  # Background workers (GitLab sync, sprint intelligence)
  worker:
    image: node:22-alpine
    container_name: emos-worker
    working_dir: /app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RUNNING_IN_DOCKER: "1"
      SKIP_DB_PUSH: "1"
      REDIS_URL: redis://redis:6379
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
      - emos_node_modules:/app/node_modules
      - ./docker/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    command:
      [
        "sh",
        "-c",
        "apk add --no-cache libc6-compat openssl >/dev/null; if [ ! -x node_modules/.bin/tsx ]; then npm ci; fi; npx prisma generate; npx tsx src/server/workers/start.ts",
      ]
    depends_on:
      redis:
        condition: service_healthy
      app:
        condition: service_started

  # Optional production image build: docker compose --profile prod up --build
  app-prod:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: emos-app-prod
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      RUNNING_IN_DOCKER: "1"
      REDIS_URL: redis://redis:6379
      NEXT_PUBLIC_APP_URL: http://localhost:${APP_PORT:-3000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy

volumes:
  emos_redis_data:
  emos_node_modules:
  emos_next_cache:
